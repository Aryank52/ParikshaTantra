version: 2
updates:
  # Maintain npm dependencies for Frontend
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain npm dependencies for Backend
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Maintain Dockerfile dependencies
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"

name: ParikshaTantra CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  ci-build:
    name: ParikshaTantra Build, Test & Security Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Verify Frontend (Typecheck & Build)
        run: |
          cd client
          npm ci
          npm run typecheck
          npm run build

      - name: Verify Backend & PostgreSQL Schema
        run: |
          cd server
          npm ci
          npx prisma generate
          npx prisma validate
          npm run typecheck
          npm run build

      - name: Dependency Security Audit
        run: |
          cd client && npm audit --audit-level=high || true
          cd ../server && npm audit --audit-level=high || true

      - name: Docker Container Build Verification
        run: |
          docker build -t parikshatantra-frontend:latest ./client
          docker build -t parikshatantra-backend:latest ./server

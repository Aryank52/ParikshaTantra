version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parikshatantra-postgres
    restart: always
    environment:
      POSTGRES_DB: parikshatantra
      POSTGRES_USER: pariksha_admin
      POSTGRES_PASSWORD: SecurePassword2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pariksha_admin -d parikshatantra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parikshatantra-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: parikshatantra-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://pariksha_admin:SecurePassword2026!@postgres:5432/parikshatantra?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "PARIKSHATANTRA_ULTRA_SECURE_JWT_SECRET_2026_PROD_GRADE"
      AES_MASTER_KEY: "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"
      HMAC_ACTIVATION_KEY: "PARIKSHATANTRA_HMAC_ACTIVATION_SECRET_KEY_998877665544332211"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: parikshatantra-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
